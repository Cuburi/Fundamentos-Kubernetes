<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" width="100%" height="100%" style="background: #0f172a; border-radius: 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow-l5" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fb923c"/>
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="30" y="24" width="800" height="50" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="50" y="46" fill="#f8fafc" font-size="16" font-weight="700">⚓ Laboratorio 5: Ciclo de Distribución OCI con Harbor / Registro Local</text>
  <text x="50" y="63" fill="#94a3b8" font-size="12">Flujo completo: Etiquetado OCI ➔ Publicación ➔ Inspección Web ➔ Despliegue Limpio</text>

  <!-- Paso 1: Máquina Local -->
  <g transform="translate(30, 95)" filter="url(#shadow-l5)">
    <rect width="385" height="150" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="18" y="16" width="36" height="36" rx="8" fill="#0369a1"/>
    <text x="26" y="40" font-size="20">💻</text>
    <text x="66" y="33" fill="#f8fafc" font-size="15" font-weight="700">1. Tu Máquina Local (Desarrollo)</text>
    <text x="66" y="50" fill="#94a3b8" font-size="12">Construir y etiquetar con nomenclatura OCI</text>
    <rect x="18" y="68" width="350" height="66" rx="6" fill="#090d16"/>
    <text x="30" y="91" fill="#94a3b8" font-size="11"># Asignar prefijo del registro de destino:</text>
    <text x="30" y="112" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="11">docker tag mi-api-cnm:v1.0 localhost:5001/...:v1.0</text>
  </g>

  <!-- Paso 2: Registro OCI Local (Puerto 5001) -->
  <g transform="translate(30, 290)" filter="url(#shadow-l5)">
    <rect width="385" height="150" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
    <rect x="18" y="16" width="36" height="36" rx="8" fill="#5b21b6"/>
    <text x="26" y="40" font-size="20">📦</text>
    <text x="66" y="33" fill="#f8fafc" font-size="15" font-weight="700">2. Registro OCI Local (Puerto 5001)</text>
    <text x="66" y="50" fill="#c4b5fd" font-size="12">Servicio registry:2 (Compatible con Harbor / OCI)</text>
    <rect x="18" y="68" width="350" height="66" rx="6" fill="#090d16"/>
    <text x="30" y="91" fill="#94a3b8" font-size="11">Almacén de capas seguras y hashes sha256</text>
    <text x="30" y="112" fill="#a78bfa" font-family="ui-monospace, monospace" font-size="11">Volumen Docker: datos-registro-local</text>
  </g>

  <!-- Flecha 1 -> 2: docker push -->
  <path d="M 222 245 L 222 288" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="5 4" fill="none" marker-end="url(#arrow-cyan)"/>
  <rect x="172" y="254" width="100" height="22" rx="11" fill="#0284c7"/>
  <text x="222" y="269" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">docker push</text>

  <!-- Paso 3: Web UI (Puerto 8082) -->
  <g transform="translate(445, 95)" filter="url(#shadow-l5)">
    <rect width="385" height="150" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
    <rect x="18" y="16" width="36" height="36" rx="8" fill="#065f46"/>
    <text x="26" y="40" font-size="20">🌐</text>
    <text x="66" y="33" fill="#f8fafc" font-size="15" font-weight="700">3. Interfaz Gráfica Web UI (8082)</text>
    <text x="66" y="50" fill="#a7f3d0" font-size="12">docker-registry-ui (http://localhost:8082)</text>
    <rect x="18" y="68" width="350" height="66" rx="6" fill="#090d16"/>
    <text x="30" y="91" fill="#94a3b8" font-size="11">Explorador visual de namespaces y catálogos:</text>
    <text x="30" y="112" fill="#34d399" font-family="ui-monospace, monospace" font-size="11">cafeteria/mi-api-cnm:v1.0 (sha256 digests)</text>
  </g>

  <!-- Flecha 2 -> 3: Inspección Web -->
  <path d="M 415 340 L 530 340 L 530 247" stroke="#34d399" stroke-width="2.5" fill="none" marker-end="url(#arrow-emerald)"/>
  <rect x="445" y="328" width="85" height="22" rx="11" fill="#059669"/>
  <text x="487" y="343" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">Inspección</text>

  <!-- Paso 4: Despliegue en Destino -->
  <g transform="translate(445, 290)" filter="url(#shadow-l5)">
    <rect width="385" height="150" rx="10" fill="#1e293b" stroke="#fb923c" stroke-width="1.5"/>
    <rect x="18" y="16" width="36" height="36" rx="8" fill="#9a3412"/>
    <text x="26" y="40" font-size="20">🚀</text>
    <text x="66" y="33" fill="#f8fafc" font-size="15" font-weight="700">4. Despliegue del Contenedor</text>
    <text x="66" y="50" fill="#fed7aa" font-size="12">Descarga limpia y ejecución en puerto 8080</text>
    <rect x="18" y="68" width="350" height="66" rx="6" fill="#090d16"/>
    <text x="30" y="91" fill="#94a3b8" font-size="11"># Descargar y correr desde el registro:</text>
    <text x="30" y="112" fill="#fb923c" font-family="ui-monospace, monospace" font-size="11">docker run -d -p 8080:8080 localhost:5001/...</text>
  </g>

  <!-- Flecha 2 -> 4: docker pull -->
  <path d="M 415 390 L 443 390" stroke="#fb923c" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/>
  <rect x="400" y="365" width="85" height="20" rx="10" fill="#c2410c"/>
  <text x="442" y="379" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">docker pull</text>
</svg>