name: 🏆 Gamificación - Evaluar Ejercicios y Actualizar Ranking Automáticamente

on:
  pull_request_target:
    types: [closed]
    branches: [main, master]

permissions:
  contents: write
  pull-requests: write

jobs:
  actualizar-rango:
    name: Evaluar Ejercicios y Actualizar Ranking en ASISTENTES.md
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: 🎖️ Evaluar ejercicios completados y actualizar ranking
        id: calcular
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const {
              INSTRUCTORS,
              cleanLinkedin,
              discoverOfficialChallenges,
              evaluateUserProgress,
              syncAllFiles
            } = require('./scripts/generar-asistentes.js');

            const pr = context.payload.pull_request;
            const user = pr.user.login;

            if (pr.user.type === 'Bot' || user.includes('[bot]')) {
              console.log('Ignorando bots de GitHub');
              core.setOutput('has_updates', 'false');
              return;
            }

            const instructors = [...INSTRUCTORS, context.repo.owner.toLowerCase()];
            if (instructors.includes(user.toLowerCase())) {
              console.log(`Ignorando instructor @${user}: no participa en la tabla de puntajes.`);
              core.setOutput('has_updates', 'false');
              return;
            }

            let data = JSON.parse(fs.readFileSync('asistentes.json', 'utf8'));
            let mdBefore = fs.readFileSync('ASISTENTES.md', 'utf8');
            let readmeBefore = fs.existsSync('README.md') ? fs.readFileSync('README.md', 'utf8') : '';

            // Detectar si agregaron fila manual en ASISTENTES.md
            let manualEntry = null;
            for (const line of mdBefore.split('\n')) {
              if (
                line.trim().startsWith('|') &&
                (line.toLowerCase().includes(user.toLowerCase()) || line.includes('TU-USUARIO'))
              ) {
                const parts = line.split('|').map(p => p.trim());
                if (parts.length >= 6) {
                  const nameMatch = (parts[1] + ' ' + parts[2]).match(/\*\*(.+?)\*\*/);
                  const linkedinMatch = line.match(/linkedin\.com\/[^\s)"]+/i);
                  manualEntry = {
                    github: user,
                    nombre: nameMatch ? nameMatch[1].trim() : user,
                    rol: parts[2] || 'Tripulante de la Comunidad',
                    linkedin: linkedinMatch ? cleanLinkedin('https://' + linkedinMatch[0]) : '',
                    redes: [],
                    rango: '⛵ Marinero',
                    motivacion: parts[parts.length - 2] || `Aporte en PR #${pr.number}: ${pr.title.replace(/\|/g, '')}`
                  };
                }
              }
            }

            const existingIndex = data.findIndex(item => item.github.toLowerCase() === user.toLowerCase());
            if (existingIndex < 0) {
              data.push(
                manualEntry || {
                  github: user,
                  nombre: pr.user.name || user,
                  rol: 'Tripulante de la Comunidad',
                  linkedin: '',
                  redes: [],
                  rango: '⛵ Marinero',
                  motivacion: `Aporte en PR #${pr.number}: ${pr.title.replace(/\|/g, '')}`
                }
              );
            }

            const officialChallenges = discoverOfficialChallenges();
            const userEval = evaluateUserProgress(user, officialChallenges);

            syncAllFiles(data);

            const mdAfter = fs.readFileSync('ASISTENTES.md', 'utf8');
            const readmeAfter = fs.existsSync('README.md') ? fs.readFileSync('README.md', 'utf8') : '';

            const reportLines = userEval.detailedReport
              .filter(r => r.solvedCount > 0)
              .map(r => {
                if (r.isComplete) {
                  return `- ✅ **${r.weekKey}:** \`${r.solvedCount}/${r.totalExpected} retos validados\` *(¡Semana 100% completada! +50 XP)*`;
                }
                return `- ⏳ **${r.weekKey} (Incompleta):** \`${r.solvedCount}/${r.totalExpected} retos validados\` *(Faltan por resolver/corregir: ${r.missingNums.join(', ')} — suma +50 XP al completar todos)*`;
              });

            const reportMarkdown =
              reportLines.length > 0
                ? reportLines.join('\n')
                : '- 📝 **Registro en el Muro de la Tripulación:** `+10 XP`';

            core.setOutput('has_updates', (mdBefore !== mdAfter || readmeBefore !== readmeAfter) ? 'true' : 'false');
            core.setOutput('new_rank', userEval.rango);
            core.setOutput('points', userEval.points.toString());
            core.setOutput('report', reportMarkdown);

      - name: 💾 Guardar cambios en el repositorio
        if: steps.calcular.outputs.has_updates == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add asistentes.json ASISTENTES.md README.md
          if ! git diff --staged --quiet; then
            git commit -m "chore(gamificacion): actualizar puntaje de @${{ github.event.pull_request.user.login }} (${{ steps.calcular.outputs.points }} XP - ${{ steps.calcular.outputs.new_rank }}) [skip ci]"
            git pull --rebase origin ${{ github.event.repository.default_branch }}
            git push origin HEAD:${{ github.event.repository.default_branch }}
          fi

      - name: 📣 Publicar reporte de evaluación y puntaje en el Pull Request
        uses: actions/github-script@v9
        with:
          script: |
            const user = context.payload.pull_request.user.login;
            const rank = '${{ steps.calcular.outputs.new_rank }}';
            const points = '${{ steps.calcular.outputs.points }}';
            const report = `${{ steps.calcular.outputs.report }}`;

            if (!points) return;

            const comment = `### 🏆 ¡Felicidades @${user}! Tu Pull Request ha sido fusionado con éxito.

            📊 **Reporte de Evaluación de tus Ejercicios y Puntaje:**
            - 🎖️ **Rango actual:** **${rank}**
            - ⚡ **Puntaje Total:** **${points} XP**

            #### 📋 Detalle por semana:
            ${report}

            > 💡 *Recuerda: Para que una semana cuente como **100% Completada** y otorgue el bono de **+20 XP** (necesario para ascender a **🧭 Timonel** y **⚓ Capitán K8s**), debes incluir la solución de **todos los ejercicios** de esa semana dentro de tu carpeta \`aportes-comunidad/soluciones-retos/${user}/semana-XX/\`.*

            👉 **[Ver la Tabla de Posiciones en ASISTENTES.md](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/ASISTENTES.md)**`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: comment
            });
