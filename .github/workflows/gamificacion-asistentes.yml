name: 🏆 Gamificación - Actualizar Rango Automáticamente

on:
  pull_request_target:
    types: [closed]
    branches: [main, master]

permissions:
  contents: write
  pull-requests: write

jobs:
  actualizar-rango:
    name: Actualizar Rango en ASISTENTES.md
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: 🎖️ Calcular y actualizar rango de asistente
        id: calcular
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const { cleanLinkedin, updateReadmeWithMosaic, renderAsistentesMarkdown } = require('./scripts/generar-asistentes.js');
            const pr = context.payload.pull_request;
            const user = pr.user.login;

            if (pr.user.type === 'Bot' || user.includes('[bot]')) {
              console.log('Ignorando bots de GitHub');
              core.setOutput('has_updates', 'false');
              return;
            }

            // Ignorar al instructor / mantenedor principal (siempre mantiene su rango fijo de Capitán)
            const instructors = ['edwinbermudez91', context.repo.owner.toLowerCase()];
            if (instructors.includes(user.toLowerCase())) {
              console.log(`Ignorando instructor @${user}: mantiene su rango fijo de Capitán.`);
              core.setOutput('has_updates', 'false');
              return;
            }

            // Consultar todos los PRs cerrados y fusionados de este usuario
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed',
              per_page: 100
            });

            const mergedCount = pulls.filter(p =>
              p.user &&
              p.user.login.toLowerCase() === user.toLowerCase() &&
              p.merged_at !== null
            ).length;

            console.log(`Usuario @${user} tiene ${mergedCount} PR(s) fusionados.`);

            // Determinar rango de navegación según gamificación
            let newRank = '⛵ Marinero';
            if (mergedCount >= 6) {
              newRank = '⚓ Capitán K8s';
            } else if (mergedCount >= 3) {
              newRank = '🧭 Timonel';
            }

            let data = JSON.parse(fs.readFileSync('asistentes.json', 'utf8'));

            // Intentar detectar si el usuario agregó una fila manualmente en ASISTENTES.md en su PR
            // para migrar sus datos a asistentes.json sin que se pierdan ni quede fuera de formato
            let mdContent = fs.readFileSync('ASISTENTES.md', 'utf8');
            let mdLines = mdContent.split('\n');
            let manualEntry = null;
            for (const line of mdLines) {
              if (
                line.trim().startsWith('|') &&
                (line.toLowerCase().includes(user.toLowerCase()) || line.includes('TU-USUARIO'))
              ) {
                const parts = line.split('|').map(p => p.trim());
                if (parts.length >= 6) {
                  const nameMatch = parts[1].match(/\*\*(.+?)\*\*/);
                  const linkedinMatch = parts[3].match(/linkedin\.com\/[^\s)"]+/i);
                  manualEntry = {
                    github: user,
                    nombre: nameMatch ? nameMatch[1].trim() : user,
                    rol: parts[2] || 'Tripulante de la Comunidad',
                    linkedin: linkedinMatch ? cleanLinkedin('https://' + linkedinMatch[0]) : '',
                    redes: [],
                    rango: newRank,
                    motivacion: parts[5] || `Aporte en PR #${pr.number}: ${pr.title.replace(/\|/g, '')}`
                  };
                }
              }
            }

            const existingIndex = data.findIndex(item => item.github.toLowerCase() === user.toLowerCase());
            let updated = false;

            if (existingIndex >= 0) {
              // Asegurar que la capitalización del usuario coincida con GitHub
              if (data[existingIndex].github !== user) {
                data[existingIndex].github = user;
                updated = true;
              }
              if (data[existingIndex].rango !== newRank) {
                data[existingIndex].rango = newRank;
                updated = true;
              }
              if (manualEntry) {
                if (data[existingIndex].rol === 'Tripulante de la Comunidad' && manualEntry.rol !== 'Tripulante de la Comunidad') {
                  data[existingIndex].rol = manualEntry.rol;
                  updated = true;
                }
                if (!data[existingIndex].linkedin && manualEntry.linkedin) {
                  data[existingIndex].linkedin = manualEntry.linkedin;
                  updated = true;
                }
              }
            } else {
              // Si no estaba en asistentes.json, agregarlo con el estándar oficial
              data.push(
                manualEntry || {
                  github: user,
                  nombre: pr.user.name || user,
                  rol: 'Tripulante de la Comunidad',
                  linkedin: '',
                  redes: [],
                  rango: newRank,
                  motivacion: `Aporte en PR #${pr.number}: ${pr.title.replace(/\|/g, '')}`
                }
              );
              updated = true;
            }

            // Regenerar siempre ASISTENTES.md desde asistentes.json para garantizar el estándar 100%
            const renderedMd = renderAsistentesMarkdown(data);
            if (renderedMd !== mdContent) {
              updated = true;
            }

            if (updated) {
              fs.writeFileSync('asistentes.json', JSON.stringify(data, null, 2) + '\n', 'utf8');
              fs.writeFileSync('ASISTENTES.md', renderedMd, 'utf8');
              if (fs.existsSync('README.md')) {
                const readme = fs.readFileSync('README.md', 'utf8');
                fs.writeFileSync('README.md', updateReadmeWithMosaic(data, readme), 'utf8');
              }
              core.setOutput('has_updates', 'true');
              core.setOutput('new_rank', newRank);
              core.setOutput('count', mergedCount.toString());
            } else {
              core.setOutput('has_updates', 'false');
            }

      - name: 💾 Guardar cambios en el repositorio
        if: steps.calcular.outputs.has_updates == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add asistentes.json ASISTENTES.md README.md
          if ! git diff --staged --quiet; then
            git commit -m "chore(gamificacion): actualizar rango de navegación de @${{ github.event.pull_request.user.login }} a ${{ steps.calcular.outputs.new_rank }} [skip ci]"
            git pull --rebase origin ${{ github.event.repository.default_branch }}
            git push origin HEAD:${{ github.event.repository.default_branch }}
          fi

      - name: 📣 Felicitar al contribuyente en el Pull Request
        if: steps.calcular.outputs.has_updates == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const user = context.payload.pull_request.user.login;
            const rank = '${{ steps.calcular.outputs.new_rank }}';
            const count = '${{ steps.calcular.outputs.count }}';

            const comment = `### 🏆 ¡Felicidades @${user}! Tu Pull Request ha sido fusionado con éxito.
            
            🎖️ **Tu rango de navegación ha sido actualizado automáticamente en el [Muro de Asistentes](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/ASISTENTES.md):**
            👉 **${rank}** *(Total de aportes fusionados: ${count})*
            
            ¡Gracias por navegar y construir en comunidad con **Cloud Native Medellín**! 🏔️☕⚓`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: comment
            });
